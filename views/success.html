<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - HHC</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            text-align: center;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            height: 100px;
        }
        .success-container {
            background-color: #fff;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        .success-container h2 {
            color: #28a745; /* Green color for success */
            margin-bottom: 20px;
        }
        .success-container p {
            color: #555;
            margin-bottom: 30px;
        }
        .success-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1rem;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: #fff;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="/logo.png" alt="HHC Logo">
    </div>
    <div class="success-container">
        <h2><i class="fas fa-check-circle"></i> Account Created!</h2>
        <p>Your account has been created successfully. You can now log in to access your dashboard.</p>
        <div class="success-actions">
            <a href="/" class="btn btn-secondary">Go to Home Page</a>
            <a href="/login" class="btn btn-primary">Go to Login Page</a>
        </div>
    </div>
</body>
</html>
